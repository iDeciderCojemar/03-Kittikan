<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="card">
            
            <div class="card-graphic">
                <img src="Blog Image.png" alt="Card Illustration" class="illustration">
            </div>

            <div class="card-content">
                
                <span class="card-tag">Learning</span>
                
                <p class="card-date">Published 21 Dec 2023</p>
                
                <h1 class="card-title">HTML & CSS foundations</h1>
                
                <p class="card-description">
                    These languages are the backbone of every <br> website, defining structure, content, and <br> presentation.
                </p>
                
                <div class="card-author">
                    <img src="userpic.png" alt="Author's Avatar" class="author-avatar">
                    <span class="author-name">Greg Hooper</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
